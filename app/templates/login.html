<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>登录 · 公众号 Bridge</title>
  <style>
    :root{color-scheme:light;--ink:#102a24;--muted:#667b74;--line:#dbe7e2;--brand:#087f5b;--brand2:#16a36f;--paper:#fff;--bg:#eef5f1;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 15%,#d9f8e9 0,transparent 28%),radial-gradient(circle at 85% 80%,#dbeafe 0,transparent 30%),var(--bg);display:grid;place-items:center;padding:24px}
    .shell{width:min(100%,980px);display:grid;grid-template-columns:1.15fr .85fr;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:0 28px 70px rgba(25,65,52,.16);overflow:hidden;backdrop-filter:blur(18px)}
    .story{padding:58px;background:linear-gradient(145deg,#073b30,#0d7355);color:white;position:relative;overflow:hidden}.story:after{content:"";position:absolute;width:280px;height:280px;border:60px solid rgba(255,255,255,.06);border-radius:50%;right:-130px;bottom:-140px}.brand{display:flex;gap:12px;align-items:center;font-size:14px;font-weight:700;letter-spacing:.08em}.logo{width:38px;height:38px;border-radius:12px;background:#d5ffed;color:#075e47;display:grid;place-items:center;font-size:19px}.story h1{font-size:42px;line-height:1.12;margin:70px 0 20px;letter-spacing:-.04em}.story p{color:#cce8dd;line-height:1.8;max-width:430px}.pill{display:inline-flex;margin-top:32px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);border-radius:999px;padding:9px 14px;font-size:13px;color:#ddf8ee}
    .login{padding:58px 48px;display:flex;flex-direction:column;justify-content:center}.login h2{font-size:28px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 34px;font-size:14px}.field{margin-bottom:18px}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;outline:none;background:#fbfdfc}.field input:focus{border-color:var(--brand2);box-shadow:0 0 0 4px rgba(22,163,111,.12)}button{width:100%;border:0;border-radius:12px;padding:14px;background:var(--brand);color:white;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 10px 24px rgba(8,127,91,.2)}button:hover{background:#066b4d}.error{background:#fff1f0;color:var(--danger);border:1px solid #ffd2cf;padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:18px}.foot{font-size:12px;color:#84968f;margin-top:22px;text-align:center}
    @media(max-width:760px){.shell{grid-template-columns:1fr}.story{display:none}.login{padding:42px 28px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="story">
      <div class="brand"><span class="logo">⇄</span> WECHAT OPS BRIDGE</div>
      <h1>一处管理，<br>多号安全运营。</h1>
      <p>统一管理公众号凭证、智能体 API Key 和运营审计记录，每个智能体只能访问自己绑定的公众号。</p>
      <span class="pill">凭证加密存储 · 权限隔离 · 全程审计</span>
    </section>
    <section class="login">
      <h2>管理员登录</h2>
      <p class="sub">请使用 Bridge 管理员账号继续</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post" action="{{ base_path }}/admin/login" autocomplete="on">
        <div class="field"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button type="submit">安全登录</button>
      </form>
      <div class="foot">仅授权管理员可访问</div>
    </section>
  </main>
</body>
</html>
